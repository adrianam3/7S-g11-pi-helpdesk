<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <img src="assets/icon/logo.png" alt="Logo" class="logo">

    <h2>Bienvenido al Sistema HELP DESK!</h2>
    <p>Por favor, inicie sesión con sus credenciales</p>

    <!-- Campo de Email -->
    <ion-item class="input-item">
      <ion-icon name="mail-outline" slot="start"></ion-icon>
      <ion-input type="email" [(ngModel)]="email" placeholder="Correo Electrónico" required></ion-input>
    </ion-item>

    <!-- Campo de Contraseña -->
    <ion-item class="input-item">
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="Contraseña" required></ion-input>
      <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" slot="end" (click)="togglePasswordVisibility()"></ion-icon>
    </ion-item>

    <!-- Botón de inicio de sesión -->
    <ion-button expand="full" color="primary" (click)="login()">
      <ion-icon name="log-in-outline" slot="start"></ion-icon>
      Iniciar Sesión
    </ion-button>

    <!-- Texto para recuperación de contraseña -->
    <ion-text color="primary" class="forgot-password" (click)="displayRecovery = true">
      ¿Olvidó su contraseña?
    </ion-text>
  </div>

  <!-- Spinner de carga -->
  <ion-spinner *ngIf="loading"></ion-spinner>
</ion-content>
