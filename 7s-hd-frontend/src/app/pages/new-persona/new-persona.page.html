<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button> <!-- Botón para abrir el menú -->
    </ion-buttons>
    <ion-title>{{ isEdicion ? 'Editar Persona' : 'Nueva Persona' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="confirmVolver()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Datos de la Persona</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="personaForm">

        <ion-item>
          <ion-label position="floating">Cédula</ion-label>
          <ion-input formControlName="cedula" type="text"></ion-input>
        </ion-item>
        <ion-text color="danger" *ngIf="personaForm.get('cedula')!.invalid && personaForm.get('cedula')!.touched">
          {{ getErrorMessage('cedula') }}
        </ion-text>

        <ion-item>
          <ion-label position="floating">Nombres</ion-label>
          <ion-input formControlName="nombres" type="text"></ion-input>
        </ion-item>
        <ion-text color="danger" *ngIf="personaForm.get('nombres')!.invalid && personaForm.get('nombres')!.touched">
          {{ getErrorMessage('nombres') }}
        </ion-text>

        <ion-item>
          <ion-label position="floating">Apellidos</ion-label>
          <ion-input formControlName="apellidos" type="text"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Dirección</ion-label>
          <ion-input formControlName="direccion" type="text"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Correo Electrónico</ion-label>
          <ion-input formControlName="email" type="email"></ion-input>
        </ion-item>
        <ion-text color="danger" *ngIf="personaForm.get('email')!.invalid && personaForm.get('email')!.touched">
          {{ getErrorMessage('email') }}
        </ion-text>

        <ion-item>
          <ion-label position="floating">Teléfono</ion-label>
          <ion-input formControlName="telefono" type="text"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Celular</ion-label>
          <ion-input formControlName="celular" type="text"></ion-input>
        </ion-item>

      </form>
    </ion-card-content>
  </ion-card>

  <ion-footer>
    <ion-toolbar>
      <ion-buttons slot="end">
        <ion-button color="danger" (click)="confirmVolver()">Cancelar</ion-button>
        <ion-button color="primary" (click)="confirmCrearActualizar()">
          {{ isEdicion ? 'Actualizar' : 'Guardar' }}
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-footer>
</ion-content>
