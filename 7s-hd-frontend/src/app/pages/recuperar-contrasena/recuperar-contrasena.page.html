
<ion-header>
  <ion-toolbar>
    <ion-title>Recuperar Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="container">
    <img src="assets/icon/logo.png" class="logo" />
    <h2>¿Olvidaste tu contraseña?</h2>
    <p>Ingresa tu correo electrónico para enviarte un enlace de recuperación.</p>

    <form [formGroup]="form" (ngSubmit)="sendRecoveryEmail()">
      <ion-item>
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input type="email" formControlName="email"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
        Ingresa un correo electrónico válido.
      </ion-text>

      <ion-button expand="block" type="submit" [disabled]="form.invalid">
        <ion-icon name="mail-unread-outline" slot="start"></ion-icon>
        Enviar enlace de recuperación
      </ion-button>
    </form>
  </div>
</ion-content>
